name: Prices

# Every hour: read the WoW: Forever auction houses from Blizzard's API, record
# what was bought, update the price history and trending lists, and publish a
# GitHub Release with Cutpurse Ledger + fresh prices.
#
# Blizzard refreshes the houses around :23. GitHub's scheduler sometimes runs
# late or skips a slot, so there are two slots an hour (:40 and :10); whichever
# comes second does nothing if a release went out in the last 45 minutes.
on:
  schedule:
    - cron: "40 * * * *"
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Also upload these prices to CurseForge now"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the run keep its own schedule switched on (see "Keep schedule alive")

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      GH_TOKEN: ${{ github.token }}
      KEEP_RELEASES: 48
    steps:
      - name: Skip if a fresh release exists
        id: fresh
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh release list -R "${{ github.repository }}" --limit 1 --json createdAt --jq '.[0].createdAt' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "Last release $last is under 45 minutes old: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Tests
        if: steps.fresh.outputs.skip != 'true'
        run: node --test poller/*.test.mjs

      - name: Get previous history
        if: steps.fresh.outputs.skip != 'true'
        run: git clone --quiet --depth 1 --branch history "$REPO_URL" history || mkdir -p history

      - name: Fetch auction houses
        if: steps.fresh.outputs.skip != 'true'
        run: node poller/ah.mjs
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REGION: ${{ vars.BNET_REGION || 'eu' }}
          AH_RULESET: ${{ vars.AH_RULESET || '2' }}
          AH_HOUSES: ${{ vars.AH_HOUSES || 'all' }}

      - name: Build zip
        if: steps.fresh.outputs.skip != 'true'
        id: build
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/LootLedger/LootLedger.toc | tr -d '\r')
          stamp=$(date -u +%Y%m%d%H%M)
          mkdir -p dist/pkg
          cp -r addon/LootLedger out/LootLedger_Prices dist/pkg/
          (cd dist/pkg && zip -qr "../CutpurseLedger-$version-$stamp.zip" LootLedger LootLedger_Prices)
          echo "tag=v$version-$stamp" >> "$GITHUB_OUTPUT"
          echo "title=Cutpurse Ledger $version · prices $(date -u '+%Y-%m-%d %H:%M') UTC" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.fresh.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.build.outputs.tag }}" dist/CutpurseLedger-*.zip \
            --title "${{ steps.build.outputs.title }}" \
            --notes "Cutpurse Ledger with auction house prices from $(date -u '+%Y-%m-%d %H:%M') UTC. Install or update both folders (LootLedger and LootLedger_Prices) into Interface/AddOns of your _forever_ folder." \
            --latest

      # CurseForge gets the price addon every 6 hours (00, 06, 12, 18 UTC), or when asked.
      - name: Upload prices to CurseForge
        if: ${{ steps.fresh.outputs.skip != 'true' && (inputs.curseforge || github.event_name == 'schedule') }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          FORCE: ${{ inputs.curseforge }}
        run: |
          hour=$(date -u +%H)
          if [ "$FORCE" != "true" ] && [ $((10#$hour % 6)) -ne 0 ]; then echo "Not a CurseForge hour ($hour UTC)"; exit 0; fi
          if [ -z "$CF_API_KEY" ]; then echo "No CF_API_KEY secret, skipping"; exit 0; fi
          stamp=$(date -u '+%Y-%m-%d %H:%M')
          (cd dist/pkg && zip -qr "../CutpurseLedgerPrices-EU-$(date -u +%Y%m%d%H%M).zip" LootLedger_Prices)
          node poller/curseforge.mjs --project 1825560 --file dist/CutpurseLedgerPrices-EU-*.zip \
            --name "Prices $stamp UTC" --changelog "Auction house prices for every EU WoW: Forever auction house, $stamp UTC."

      # History lives on its own branch, replaced every run (one commit, so the repo doesn't grow).
      - name: Keep history
        if: steps.fresh.outputs.skip != 'true'
        run: |
          cd out/history
          git init --quiet --initial-branch history
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "$REPO_URL" history

      - name: Prune old releases
        if: steps.fresh.outputs.skip != 'true'
        run: |
          gh release list --limit 300 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      # GitHub switches off schedules in public repos after 60 days without repository
      # activity. Re-enabling the workflow once a day resets that clock, so the price
      # feed never stops just because nobody pushed code for a while.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prices.yml/enable" && echo "schedule refreshed"
          fi
