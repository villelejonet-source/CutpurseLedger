name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Before installing anything: the feed (prices.yml) runs these without packages.
      - name: Feed tests
        run: node --test poller/*.test.mjs
      - name: Install test tools (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Addon and workflow tests (Lua in fengari, YAML)
        run: node --test tests/*.test.mjs
      - name: Lua syntax (addon)
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), luaparse = require("luaparse");
            const toc = fs.readFileSync("addon/LootLedger/LootLedger.toc", "utf8").split(/\r?\n/).filter((l) => l.endsWith(".lua"));
            for (const f of toc) {
              const file = path.join("addon/LootLedger", ...f.split("\\"));
              luaparse.parse(fs.readFileSync(file, "utf8"), { luaVersion: "5.1" });
              console.log("ok", file);
            }'
