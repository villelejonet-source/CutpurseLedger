<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#262231"/>
      <stop offset="1" stop-color="#0c0b12"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3d22"/>
      <stop offset="1" stop-color="#2a1b0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe49a"/>
      <stop offset="0.45" stop-color="#f2bd45"/>
      <stop offset="1" stop-color="#a86f17"/>
    </linearGradient>
    <radialGradient id="coin" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.5" stop-color="#f5c54f"/>
      <stop offset="1" stop-color="#b07619"/>
    </radialGradient>
    <clipPath id="bagClip">
      <path d="M170 214 C118 262 104 372 148 418 C176 446 222 452 256 452 C290 452 336 446 364 418 C408 372 394 262 342 214 Z"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#8c6a2a" stroke-width="6" opacity="0.85"/>

  <!-- pouch body -->
  <path d="M170 214 C118 262 104 372 148 418 C176 446 222 452 256 452 C290 452 336 446 364 418 C408 372 394 262 342 214 Z"
        fill="url(#leather)" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>

  <!-- ledger page ruled onto the leather -->
  <g clip-path="url(#bagClip)" stroke="#f2bd45" stroke-width="4" opacity="0.28">
    <line x1="100" y1="290" x2="412" y2="290"/>
    <line x1="100" y1="332" x2="412" y2="332"/>
    <line x1="100" y1="374" x2="412" y2="374"/>
    <line x1="100" y1="416" x2="412" y2="416"/>
    <line x1="196" y1="230" x2="196" y2="460" stroke="#ff7a59" opacity="0.9"/>
  </g>

  <!-- price line climbing across the pouch -->
  <polyline points="150,402 206,366 246,384 296,318 334,334 382,262"
            fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- neck, gathered -->
  <path d="M190 178 C206 194 306 194 322 178 L342 214 C320 234 192 234 170 214 Z"
        fill="#3d2816" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
  <!-- frill above the tie -->
  <path d="M196 182 C186 160 196 140 214 132 C226 146 238 150 256 142 C274 150 286 146 298 132 C316 140 326 160 316 182 C300 194 212 194 196 182 Z"
        fill="#4a311b" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
  <!-- gathered folds -->
  <g fill="none" stroke="#c99232" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M226 150 C222 162 222 174 226 184"/>
    <path d="M256 152 C254 164 254 176 256 186"/>
    <path d="M286 150 C290 162 290 174 286 184"/>
    <path d="M214 198 C218 208 220 216 218 224"/>
    <path d="M298 198 C294 208 292 216 294 224"/>
  </g>
  <!-- drawstring knot and tail -->
  <circle cx="256" cy="206" r="11" fill="url(#gold)"/>
  <path d="M262 214 C276 238 268 256 284 272" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

  <!-- coin escaping the pouch, where the line ends -->
  <g transform="translate(392 214) rotate(-14)">
    <circle r="46" fill="url(#coin)" stroke="#7a4f10" stroke-width="5"/>
    <circle r="33" fill="none" stroke="#b07619" stroke-width="4" opacity="0.8"/>
    <!-- engraved dagger: a nod to the rogue -->
    <g fill="#7a4f10">
      <path d="M0 -27 L6 -6 L6 8 L-6 8 L-6 -6 Z"/>
      <rect x="-15" y="8" width="30" height="6" rx="3"/>
      <rect x="-3.5" y="14" width="7" height="11" rx="2"/>
      <circle cx="0" cy="28" r="4.5"/>
    </g>
    <path d="M0 -21 L0 5" stroke="#f9d77e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- sparkle -->
  <path d="M438 150 L444 166 L460 172 L444 178 L438 194 L432 178 L416 172 L432 166 Z" fill="#fff2c2"/>
</svg>
